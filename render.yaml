services:
  - type: web
    name: sentinel-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: USE_MOCK_MODELS
        value: "true"
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma
      - key: MODELS_DIR
        value: /tmp/models
      - key: SENTENCE_MODEL
        value: all-MiniLM-L6-v2
      - key: WEATHER_LIVE
        value: "false"
      # Set these in the Render dashboard (secret env vars):
      # - key: OPENWEATHER_API_KEY
      #   value: your_key_here
      # - key: FRONTEND_URL
      #   value: https://your-app.vercel.app
